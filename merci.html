<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Merci, La Caravane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Schibsted+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--night:#17123A;--night-2:#201956;--line:rgba(250,235,211,.16);--cream:#FAEBD3;--cream-dim:rgba(250,235,211,.72);--bulb:#FFC83D;--coral:#FF7D73;--leaf:#7ED94B;--lagoon:#58C4F0;--ink:#1D1338;--paper:#FFF7E8;--ink-soft:#5B4F78;--display:"Caprasimo",Georgia,serif;--text:"Schibsted Grotesk",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(50% 40% at 80% 10%,rgba(255,125,115,.22),transparent 70%),radial-gradient(45% 40% at 10% 90%,rgba(88,196,240,.16),transparent 70%),var(--night);color:var(--cream);font:400 1.0625rem/1.6 var(--text);display:grid;grid-template-rows:auto 1fr auto}
a{color:inherit}
header,footer{padding:22px clamp(16px,4vw,48px)}
.logo{display:inline-flex;align-items:center;gap:10px;color:var(--cream);text-decoration:none}
.logo svg{display:block;fill:currentColor;width:auto}.logo .logo-icon{height:44px}.logo .logo-word{height:21px;margin-top:4px}
main{display:grid;place-items:center;padding:20px 16px 60px}
.card{width:min(100%,620px);background:var(--paper);color:var(--ink);border-radius:28px;padding:clamp(26px,5vw,44px);box-shadow:0 40px 80px -30px rgba(0,0,0,.7);position:relative;overflow:hidden}
.bulbs{display:flex;gap:10px;margin-bottom:22px}
.bulbs i{width:16px;height:22px;border-radius:8px 8px 10px 10px;background:var(--c);box-shadow:0 0 16px var(--c);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d)}
@keyframes pop{from{transform:translateY(-14px) scale(.6);opacity:0}}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,6vw,3.2rem);line-height:1.02;margin:0 0 14px}
.lead{margin:0 0 22px;color:var(--ink-soft);font-size:1.12rem}
dl{margin:0 0 22px;border-top:1px dashed rgba(29,19,56,.25)}
dl div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px dashed rgba(29,19,56,.25)}
dt{color:var(--ink-soft)}dd{margin:0;font-weight:700;text-align:right}
dd.big{font-family:var(--display);font-weight:400;font-size:1.5rem}
.note{padding:14px 16px;border-radius:12px;background:#FFF1C9;border:1.5px solid rgba(255,200,61,.9);font-weight:600;margin:0 0 22px}
.warn{background:#FFE1DD;border-color:#FF7D73;color:#7A1F16}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 22px;border-radius:999px;font-weight:700;text-decoration:none;border:2px solid transparent;cursor:pointer;font:inherit;font-weight:700}
.btn-ink{background:var(--ink);color:var(--paper)}.btn-ghost{border-color:rgba(29,19,56,.25);color:var(--ink);background:none}
.btn:focus-visible{outline:3px solid var(--bulb);outline-offset:3px}
.loading{color:var(--ink-soft)}
footer{color:var(--cream-dim);font-size:.92rem;text-align:center}
footer a{color:var(--cream)}
@media (prefers-reduced-motion:reduce){.bulbs i{animation:none}}
</style>
</head>

    $('#body').innerHTML = rows([['Soirée', q.get('soiree')], ['Date', dateFr(q.get('date'))], ['Pass', n + (prix ? ' × ' + euro(prix) : '')], prix ? ['À régler sur place', euro(n * prix), true] : null]) +
      '<p class="note">' + (q.get('gratuit') ? 'Entrée gratuite : votre table est notée, les consommations se règlent sur place.' : 'Le pass comprend l\'entrée et une consommation. Il se règle sur place, le soir même.') + '</p>';
    addCal(q.get('soiree') || 'Soirée', q.get('date'));
  } else if (type === 'attente') {
    $('#t').textContent = 'Vous êtes sur la liste d\'attente';
    $('#lead').innerHTML = 'Merci' + prenom + '. La soirée est complète pour le moment : nous vous recontactons dès qu\'une place se libère.';
    $('#body').innerHTML = rows([['Soirée', q.get('soiree')], ['Date', dateFr(q.get('date'))], ['Personnes', q.get('n')]]);
  } else {
    $('#t').textContent = 'Demande bien reçue';
    $('#lead').innerHTML = 'Merci' + prenom + ' ! Nous revenons vers vous très vite pour confirmer la date. Un e-mail récapitulatif vous a été envoyé.';
    $('#body').innerHTML = '<p class="note">Une question en attendant ? Appelez-nous au 03 26 07 59 10.</p>';
  }
})();
</script>
</body>
</html>
